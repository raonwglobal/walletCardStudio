name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install
      - name: Frontend typecheck
        run: bun run typecheck
      - name: Frontend unit tests
        run: bun run test
      - name: Frontend production build
        run: bun run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/share-links/index.ts
      - name: Supabase share validation unit tests
        run: deno test supabase/functions/_shared/share-validation.test.ts

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Reset database and apply migrations
        run: supabase db reset
      - name: Run pgTAP database security tests
        run: supabase test db
